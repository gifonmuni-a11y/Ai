<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai by hw | Senka</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="senka-section">
            <img id="senka-model" src="assets/senka_idle.png" alt="Senka" onerror="this.style.display='none';document.getElementById('senka-fallback').style.display='flex';">
            <div id="senka-fallback" class="senka-fallback"><i class="fa-solid fa-robot"></i></div>
        </div>
        <div class="chat-section">
            <div class="glass-panel">
                <div class="chat-header">
                    <h2><i class="fa-solid fa-microchip"></i> ai by hw</h2>
                    <div class="header-actions">
                        <span class="status">Senka Online</span>
                        <i class="fa-solid fa-gear gear-btn" onclick="openSettings()" title="Pengaturan"></i>
                    </div>
                </div>
                <div id="chat-history" class="chat-history"></div>

                <div id="preview-container" class="preview-container">
                    <span><i class="fa-solid fa-image"></i> <span id="file-name-preview">Gambar</span></span>
                    <i class="fa-solid fa-xmark remove-btn" onclick="removeImage()"></i>
                </div>

                <div class="input-area">
                    <label for="image-upload" class="upload-btn"><i class="fa-solid fa-paperclip"></i></label>
                    <input type="file" id="image-upload" accept="image/*" hidden>
                    <input type="text" id="message-input" placeholder="Ketik ke Senka..." autocomplete="off">
                    <button id="send-btn" onclick="sendToSenka()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
                <div class="input-hint">Perintah: /gambar &lt;deskripsi&gt; untuk bikin gambar AI</div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders"></i> Pengaturan</h3>
                <i class="fa-solid fa-xmark modal-close" onclick="closeSettings()"></i>
            </div>
            <label class="modal-label" for="panggilan-input">Senka memanggilmu sebagai</label>
            <input type="text" id="panggilan-input" class="modal-input" placeholder="pengguna" maxlength="30">
            <label class="modal-label" for="model-select">Model AI</label>
            <select id="model-select" class="modal-input"></select>
            <p class="modal-hint">Tanpa memilih model, chat tidak bisa dikirim.</p>
            <button class="modal-btn" onclick="saveSettings()"><i class="fa-solid fa-check"></i> Simpan</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
